<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Git Analyzer</title>
    <link rel='stylesheet' href='src/output.css'>
</head>

<body>
    <nav class="bg-white dark:shadow-md min-w-full dark:bg-gray-800 sm:min-w-full">
        <div
            class="container flex items-center justify-center p-4 mx-auto text-gray-600 capitalize dark:text-gray-300 gap-10">
            <li class="list-none flex-1 flex flex-row gap-2">
                <h2 class="text-4xl">Git Analyzer</h2>
                <img src="logo/logo-transparent.png" alt="logo" height="50" width="50" class="mx-5">
            </li>
        </div>
    </nav>
    <main class="bg-gray-600 sm:min-h-screen flex" id="main">
        <div class=" px-8 py-4 bg-white shadow-md dark:bg-gray-800 flex flex-col gap-5">
            <label for="user" class="block text-xl text-white">Username</label>
            <input type="text" placeholder="Enter the UserName" id="userName"
                class="block bg-gray-500  mt-1 w-full placeholder-black/70 dark:placeholder-black rounded-lg border border-black px-4 py-1 text-black focus:border-blue-400 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-40 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-300 dark:focus:border-blue-300" />
            <label for="repo" class="block text-xl text-white ">Reponame</label>
            <input type="text" placeholder="Enter the RepoName" id="repoName"
                class="block bg-gray-500  mt-1 w-full placeholder-black/70 dark:placeholder-black rounded-lg border border-black px-4 py-1 text-black focus:border-blue-400 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-40 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-300 dark:focus:border-blue-300" />
            <label for="period" class="text-white">Select Time period for Project</label>
            <select name="period" id="period" class="bg-white rounded-lg px-4 py-1">
                <option value="7">1 Week</option>
                <option value="14">2 Week</option>
                <option value="30">1 Month</option>
                <option value="60">2 Month</option>
                <option value="90">3 Month</option>
                <option value="365">1 Year</option>
                <option value="730">2 Year</option>
            </select>
            <button class="text-xl bg-gray-600 text-white border-2 border-white hover:cursor-pointer  rounded-lg py-1" id="analyze">
                Analyze
            </button>
        </div>

        <div class="max-w-2xl max-h-6/12 m-auto  px-8 py-4 bg-white rounded-lg shadow-md dark:bg-gray-800 " id="card">
            <div class="flex items-center gap-10">
                <h2><a href=""><span class="text-2xl font-light text-white dark:text-gray-400"
                            id="repo-name"></span></a></h2>
                <li class="list-none text-white">Branches: <span id="totalbranch"></span></li>
                <li class="list-none text-white">Developers: <span id="totaldevlprs"></span></li>
                <li class="list-none text-white"> Commits: <span id="total-commits"></span></li>
                <li class="list-none text-white"> Pull req: <span id="totalprs"></span></li>
            </div>

            <div class="mt-2 flex flex-col gap-10">
                <table class="min-w-1/2 divide-y divide-gray-200">
                    <thead class="bg-gray-50 dark:bg-gray-800">
                        <tr
                            class=" py-3.5 px-4 text-sm font-normal text-left rtl:text-right text-gray-500 dark:text-gray-400">
                            <th class="text-lg">Branches</th>
                            <th class="text-lg">Commits</th>
                        </tr>
                    </thead>
                    <tbody class="text-lg text-white" id="branch-commit-pr">
                    </tbody>
                </table>
                <table class="min-w-1/2 divide-y divide-gray-200">
                    <thead class="bg-gray-50 dark:bg-gray-800">
                        <tr
                            class=" py-3.5 px-4 text-sm font-normal text-center rtl:text-right text-gray-500 dark:text-gray-400">
                            <th class="text-lg">Developer</th>
                            <th class="text-lg">Total Contribution</th>
                            <th class="text-lg">Avg Commits/activedays</th>
                            <th class="text-lg">Consistency (%)</th>
                        </tr>
                    </thead>
                    <tbody class="text-lg text-white text-center" id="developer-commits">
                    </tbody>
                </table>
            </div>
        </div>
        <div class="m-auto" id="heading">
            <h1 class="text-4xl text-white text-shadow-amber-50 font-bold font-sans">Analyze your Git Repo Here !</h1>
        </div>
        <div class="text-xl text-white" id="error-msg"></div>
    </main>
</body>
<script src="phase2.js"></script>

</html>
